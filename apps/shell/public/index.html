<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atom — open agent platform</title>
    <meta
      name="description"
      content="Atom is an open-source agent platform. Run your own agent shell — hosted commercial service is separate."
    />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        line-height: 1.5;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main {
        max-width: 36rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
      }
      p {
        margin: 0 0 1rem;
        opacity: 0.85;
      }
      a {
        color: inherit;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.25rem;
      }
      .actions a {
        display: inline-block;
        padding: 0.55rem 0.9rem;
        border: 1px solid currentColor;
        border-radius: 0.5rem;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Atom</h1>
      <p>
        Open-source agent platform — your shell, your agent, your rules. This repository is the
        <strong>platform</strong> (like WordPress.org), not Qwixl’s commercial website or hosted
        billing.
      </p>
      <div class="actions">
        <a href="/app/">Open shell</a>
        <a href="https://github.com/Qwixl/Atom">GitHub</a>
        <a href="https://github.com/Qwixl/Atom/blob/main/DEVELOPERS.md">Developers</a>
      </div>
    </main>
  </body>
</html>
