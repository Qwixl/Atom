<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meeting picker</title>
  <style>
    * { box-sizing: border-box; font-family: var(--atom-font-sans, system-ui, sans-serif); }
    body { margin: 0; padding: 10px 12px; min-height: 0; background: var(--atom-color-bg, #fff); color: var(--atom-color-text, #111); }
    .stack { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
    .field label { font-size: 11px; font-weight: 600; color: var(--atom-color-text-dim, #666); }
    input, select, button { font: inherit; }
    input, select {
      width: 100%; padding: 8px 10px;
      border: 1px solid var(--atom-color-border, #ccc); border-radius: var(--atom-radius-sm, 6px);
      background: var(--atom-color-bg-raised, #fafafa); color: inherit;
    }
    button.send {
      padding: 8px 14px; border: none; border-radius: var(--atom-radius-sm, 6px);
      background: var(--atom-color-accent, #111); color: var(--atom-color-bg, #fff); cursor: pointer;
      white-space: nowrap;
    }
    button.send:disabled { opacity: 0.45; cursor: not-allowed; }
    .warn { margin: 0; font-size: 12px; color: #b45309; }
    .busy-note { margin: 0; font-size: 11px; color: var(--atom-color-text-dim, #666); }
  </style>
</head>
<body>
  <div class="stack">
    <div class="field">
      <label for="title">Title</label>
      <input id="title" type="text" placeholder="Title" aria-label="Meeting title" />
    </div>
    <div class="row">
      <div class="field">
        <label for="date">Date</label>
        <input id="date" type="date" aria-label="Meeting date" />
      </div>
      <div class="field">
        <label for="time">Time</label>
        <input id="time" type="time" aria-label="Meeting time" />
      </div>
      <div class="field" style="flex:0.7;min-width:96px">
        <label for="duration">Duration</label>
        <select id="duration" aria-label="Duration">
          <option value="15">15 min</option>
          <option value="30" selected>30 min</option>
          <option value="45">45 min</option>
          <option value="60">1 hour</option>
          <option value="90">1.5 hours</option>
        </select>
      </div>
      <button type="button" class="send" id="send">Send proposal</button>
    </div>
    <p class="warn" id="conflict" hidden>That time overlaps an event on your calendar.</p>
    <p class="busy-note" id="busyNote" hidden></p>
  </div>
  <script>
    let shellOrigin = null;
    let busyEvents = [];
    let initialized = false;
    let lastDefaultTitle = "Meeting";
    const themeKeys = ["colorBg","colorBgRaised","colorText","colorTextDim","colorAccent","colorBorder","radiusSm","fontSans"];
    const cssMap = { colorBg:"--atom-color-bg", colorBgRaised:"--atom-color-bg-raised", colorText:"--atom-color-text", colorTextDim:"--atom-color-text-dim", colorAccent:"--atom-color-accent", colorBorder:"--atom-color-border", radiusSm:"--atom-radius-sm", fontSans:"--atom-font-sans" };
    function applyTheme(theme) {
      if (!theme) return;
      const root = document.documentElement.style;
      for (const k of themeKeys) if (theme[k]) root.setProperty(cssMap[k], theme[k]);
    }
    /** Next weekday (Mon–Fri) at 10:00 local — readable default for “next week” demos. */
    function defaultStartParts() {
      const next = new Date();
      next.setHours(10, 0, 0, 0);
      next.setDate(next.getDate() + 1);
      while (next.getDay() === 0 || next.getDay() === 6) next.setDate(next.getDate() + 1);
      const y = next.getFullYear();
      const m = String(next.getMonth() + 1).padStart(2, "0");
      const d = String(next.getDate()).padStart(2, "0");
      return { date: y + "-" + m + "-" + d, time: "10:00" };
    }
    function startLocalValue() {
      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value || "10:00";
      if (!date) return "";
      return date + "T" + time;
    }
    function slotFromInputs(title, startLocal, durationMin) {
      const start = new Date(startLocal);
      if (Number.isNaN(start.getTime())) return null;
      const end = new Date(start.getTime() + durationMin * 60000);
      const label = start.toLocaleString(undefined, { weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
      return { id: "slot-" + start.toISOString(), label, start: start.toISOString(), end: end.toISOString() };
    }
    function overlaps(slot, events) {
      if (!slot || !Array.isArray(events)) return false;
      const slotStart = new Date(slot.start).getTime();
      const slotEnd = new Date(slot.end).getTime();
      for (const ev of events) {
        const eventStart = new Date(ev.start).getTime();
        const eventEnd = new Date(ev.end).getTime();
        if (eventStart < slotEnd && eventEnd > slotStart) return true;
      }
      return false;
    }
    function updateConflict() {
      const startLocal = startLocalValue();
      const durationMin = Number(document.getElementById("duration").value);
      const title = document.getElementById("title").value.trim() || "Meeting";
      const slot = slotFromInputs(title, startLocal, durationMin);
      const conflict = overlaps(slot, busyEvents);
      document.getElementById("conflict").hidden = !conflict;
      const note = document.getElementById("busyNote");
      if (busyEvents.length > 0) {
        note.hidden = false;
        note.textContent = busyEvents.length + " upcoming calendar event(s) loaded from your WebCal feed.";
      } else {
        note.hidden = true;
      }
      reportHeight();
    }
    function emit(name, payload) {
      if (shellOrigin) window.parent.postMessage({ type:"event", name, payload }, shellOrigin);
    }
    function reportHeight() {
      const height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight, 140);
      window.parent.postMessage({ type: "resize", height }, "*");
    }
    function applyStartParts(parts) {
      document.getElementById("date").value = parts.date;
      document.getElementById("time").value = parts.time;
    }
    document.getElementById("send").addEventListener("click", () => {
      const title = document.getElementById("title").value.trim() || "Meeting";
      const startLocal = startLocalValue();
      const durationMin = Number(document.getElementById("duration").value);
      const slot = slotFromInputs(title, startLocal, durationMin);
      if (!slot) return;
      emit("meetingProposed", { title, slots: [slot] });
    });
    document.getElementById("date").addEventListener("change", updateConflict);
    document.getElementById("time").addEventListener("change", updateConflict);
    document.getElementById("duration").addEventListener("change", updateConflict);
    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || data.type !== "init") return;
      shellOrigin = event.origin;
      applyTheme(data.theme);
      const props = data.props || {};
      busyEvents = Array.isArray(props.busyEvents) ? props.busyEvents : [];
      const titleEl = document.getElementById("title");
      const nextDefaultTitle = typeof props.defaultTitle === "string" && props.defaultTitle.trim()
        ? props.defaultTitle.trim()
        : "Meeting";
      // Parent re-inits on poll/re-render — never wipe a title the user (or agent) already set.
      if (!initialized) {
        titleEl.value = nextDefaultTitle;
        if (typeof props.defaultStart === "string" && props.defaultStart.includes("T")) {
          const [date, timePart] = props.defaultStart.split("T");
          applyStartParts({ date, time: (timePart || "10:00").slice(0, 5) });
        } else {
          applyStartParts(defaultStartParts());
        }
        initialized = true;
      } else if (titleEl.value.trim() === "" || titleEl.value === lastDefaultTitle) {
        titleEl.value = nextDefaultTitle;
      }
      lastDefaultTitle = nextDefaultTitle;
      if (props.peerName) titleEl.placeholder = "Meeting with " + props.peerName;
      updateConflict();
      reportHeight();
    });
    window.parent.postMessage({ type: "ready" }, "*");
    reportHeight();
    window.addEventListener("resize", reportHeight);
  </script>
</body>
</html>
